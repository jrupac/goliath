name: CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          # The modules sit under a workspace with nothing at the root, so the
          # dependency files the build cache keys on have to be named here.
          cache-dependency-path: |
            backend/go.sum
            cmd/goliath-cli/go.sum

      # Pinned to match the Dockerfile. The distribution's protoc is too old for
      # field options the admin proto uses, such as debug_redact.
      - name: Install protoc
        run: |
          curl -sSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'

      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Lint protobufs
        run: buf lint
        working-directory: backend/admin

      - name: Compile protobufs
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          protoc --proto_path=. --go_out=. --go-grpc_out=. \
            --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative \
            backend/admin/admin.proto

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the Dockerfile, so what CI tests and what the
          # image builds are the same toolchain.
          bun-version: 1.4.4

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Run backend tests
        run: go test ./backend/...

      - name: Run CLI tests
        run: go test ./...
        working-directory: cmd/goliath-cli

      # Covers oxlint, the formatter and tsc. The test run does not typecheck:
      # the transform strips annotations without reading them, so a type error
      # reaches the suite as working code and passes it.
      - name: Lint and typecheck frontend
        run: bun run lint
        working-directory: frontend

      - name: Run frontend tests
        run: bun run test
        working-directory: frontend
