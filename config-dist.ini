; ============================================================================ ;
; Goliath configuration file
; ============================================================================ ;
; NOTE: Create a copy of this file and set configuration values as needed. This
; file should be readable by the user running the Goliath binary. Then point
; the Goliath binary to this file with "--config" flag. Any flags also set on
; the command line will override values set in this file.

[general]
; Location of directory where JS/CSS/HTML for the frontend is served.
; publicFolder = ./out/public

; Port for main Goliath HTTP server.
; port = 9999

; Port for Prometheus monitoring. Metrics are exposed at the /metrics endpoint.
; metricsPort = 9998

; Port for the gRPC-based admin server.
; adminPort = 9997

[auth]
; Secret used to sign GReader post tokens, which guard the endpoints that
; change data. There is deliberately no default: if this is unset, a key is
; generated at startup, which works but invalidates outstanding post tokens on
; every restart. Clients fetch a new one automatically, so the cost is a
; retried request rather than a failure. Set it to a long random string.
; postTokenKey =

; How long a GReader post token stays valid after being issued.
; postTokenTTL = 1h

; How long a session may go unused before it expires. Using a session pushes
; this back, so an actively syncing client stays signed in indefinitely while a
; device that goes quiet stops working.
; sessionIdleWindow = 2160h

; Minimum interval between writes recording that a session was used. Larger
; values mean fewer writes on the authentication path, at the cost of a
; coarser idea of when a session was last seen.
; sessionTouchInterval = 1h

[opml]
; Path of OPML file to import. This import is idempotent but the flag only needs
; to be set for one run to persist feeds and folders to storage.
; opmlImportPath = /tmp/import.opml

; Path to file for OPML 2.0 export. If the file does not exist, Goliath will
; create a new file with mode 0777. Any existing file will be overwritten.
; opmlExportPath = /tmp/export.opml

[storage]
; URI of CockroachDB connection.
; NOTE: This flag must be set.
; dbPath = postgresql://goliath@localhost:26257/goliath?sslmode=disable

; Interval to garbage collect old articles. This is set to daily by default.
; gcInterval = 24h

; Duration to keep read articles before garbage collection. This is set to one
; week by default.
; gcKeepDuration = 7d

[fetcher]
; Sanitize HTML content in article title and body. This uses the Bluemonday
; library for sanitization. It is highly recommended to enable this to prevent
; a class of XSS attacks.
; sanitizeHTML = true

; Normalized fetched favicons to be 256x256 in size and encoded as PNG.
; normalizeFavicons = true

; Enable serving parsed / full-text articles and allow the on-demand full-text
; extraction API (/greader/ext/parse-full-article) to function.
; serveParsedArticles = false

; Parse and rewrite images URLs served over HTTP to instead fetch from a reverse
; proxy and then re-served over HTTPS.
; proxyInsecureImages = false

; Also rewrite image URLs that are originally served over HTTPS as well. This
; flag only applies if `rewriteInsecureImageUrls` is set to true.
; proxySecureImages = false

; Base URL to reverse image proxy server. Typically, this will be the base URL
; from which the Goliath backend is served.
; proxyUrlBase = ""

; Secret used to sign image proxy URLs. Required whenever image proxying is
; enabled; Goliath will refuse to start without it, rather than run a proxy that
; would fetch any URL it is handed.
;
; The proxy endpoint is reachable by anyone, because a browser loads an image
; with an ordinary GET. Signing is what confines it to URLs Goliath itself
; rewrote. Keep this stable: signatures are written into stored article content
; when a feed is fetched, so changing it breaks images in articles already held.
; imageProxyKey =

; If true, only the link name is used to de-duplicate unread articles.
; strictDedup = false

; The max edit distance between articles to be de-duplicated, expressed as
; percent of content. If `strictDedup` is set, this is ignored.
; maxEditDedup = 0.1

; Minimum interval between feed fetches.
; minFetchInterval = 10m

; How this server identifies itself when fetching feeds and article content.
; One value for every outbound request, so a publisher deciding whether to
; serve, block or rate limit Goliath is deciding about a single client.
; userAgent = Goliath/1.0 (+http://github.com/jrupac/goliath)

; Overrides userAgent for full-text extraction only, for a site that serves
; different content depending on the client. Empty means use userAgent.
; fullTextUserAgent =

; Addresses off the public internet that feed fetching may reach anyway, as a
; comma-separated list of host:port. Feed URLs are fetched repeatedly and are
; not chosen by this server, so by default anything that is not publicly
; routable is refused. Set this only for a feed bridge deliberately run
; alongside Goliath, and name it as specifically as possible. Names are
; resolved once at startup.
; feedAllowedAddresses = localhost:1200

; Maximum interval between feed fetches.
; maxFetchInterval = 24h

; EMA smoothing factor applied when the observed publication gap is shorter than
; the current estimated interval (feed is becoming more active). Higher values
; converge faster toward a shorter cadence. Default: 0.5
; emaAlphaFaster = 0.5

; EMA smoothing factor applied when the observed publication gap is longer than
; the current estimated interval (feed appears to be slowing down). Lower values
; resist upward drift from anomalous gaps such as silence periods or server
; restarts. Default: 0.1
; emaAlphaSlower = 0.1

; Maximum ratio by which a single observed publication gap may exceed the current
; estimated interval before being clamped for the EMA update. Prevents a single
; long quiet period from disproportionately inflating the estimate in one step.
; Default: 3.0
; maxGapEMAMultiple = 3.0


[vendor]
; Vendor flags are flags defined in Goliath's dependencies.

; Uncomment to log Goliath output to both /tmp/goliath.* and stderr. Note that
; the former location is buffered and flushed periodically.
; alsologtostderr = true

; Verbosity of logging. Anything higher than v=1 outputs a large volume of logs.
; v = 2