syntax = "proto3";

option go_package = "github.com/jrupac/goliath/admin";

package admin;

message AddUserRequest {
  // Required. String value of username. Exact values (including capitalization)
  // are persisted.
  string Username = 1;

  // Required. Key used in Fever API operations. This is defined as:
  //   md5sum($username:$password)
  // Note the ":" (colon) between the user-supplied username and password.
  string Key = 2;
}

// Empty response. Success is indicated by gRPC-level status code.
message AddUserResponse {
}

message GetMuteWordsRequest {
  // Required. Username for user for whom mute words should be retrieved.
  string Username = 1;
}

message GetMuteWordsResponse {
  repeated string MuteWord = 1;
}

message AddMuteWordRequest {
  // Required. Username for user for whom mute words should be added.
  string Username = 1;

  // Optional. If set, each (unique) mute word will be added for the user.
  // Mute words are case-insensitive and the lowercase version of the word
  // will be persisted.
  repeated string MuteWord = 2;
}

// Empty response. Success is indicated by gRPC-level status code.
message AddMuteWordResponse {
}

message DeleteMuteWordRequest {
  // Required. Username for user for whom mute words should be removed.
  string Username = 1;

  // Optional. If set, each (unique) mute word will be removed for the user.
  // Mute words are case-insensitive so the lowercase version of the word
  // specified here will be removed if present.
  repeated string MuteWord = 2;
}

// Empty response. Success is indicated by gRPC-level status code.
message DeleteMuteWordResponse {
}

message GetUnmutedFeedsRequest {
  // Required. Username for user for whom unmuted feeds should be retrieved.
  string Username = 1;
}

message GetUnmutedFeedsResponse {
  repeated int64 UnmutedFeedId = 1;
}

message AddUnmutedFeedRequest {
  // Required. Username for user for whom unmuted feeds should be added.
  string Username = 1;

  // Optional. If set, each (unique) feed id will be added for the user.
  repeated int64 UnmutedFeedId = 2;
}

// Empty response. Success is indicated by gRPC-level status code.
message AddUnmutedFeedResponse {
}

message DeleteUnmutedFeedRequest {
  // Required. Username for user for whom unmuted feeds should be removed.
  string Username = 1;

  // Optional. If set, each (unique) feed id will be removed for the user.
  repeated int64 UnmutedFeedId = 2;
}

// Empty response. Success is indicated by gRPC-level status code.
message DeleteUnmutedFeedResponse {
}

message AddFeedRequest {
  // Required. Logical title of feed. It is possible to have multiple feeds of
  // the same title, so this is not checked for uniqueness.
  string Title = 1;

  // Optional. Description of feed, typically a few words in length.
  string Description = 2;

  // Required. URL should point to the fetch URL for the feed.
  string URL = 3;

  // Required. URL should point to the logical homepage for the feed.
  string Link = 5;

  // Optional. If set, this new feed will be placed under the folder of the
  // supplied name.
  string Folder = 4;

  // Required. Username for user for whom this feed should be added.
  string Username = 6;
}

// Empty response. Success is indicated by gRPC-level status code.
message AddFeedResponse {
  // Internal identifier for new feed object.
  int64 Id = 1;
}

message GetFeedsRequest {
  // Required. Username for user for whom a list of feeds is returned.
  string Username = 1;
}

message GetFeedsResponse {
  message Feed {
    // Internal identifier for new feed object.
    int64 Id = 1;

    // Logical title of feed.
    string Title = 2;
  }

  repeated Feed feeds = 1;
}

message RemoveFeedRequest {
  // Required. Username for user for whom this feed should be added.
  string Username = 1;

  // Required. Internal identifier for existing feed object.
  int64 Id = 2;
}

// Empty response. Success is indicated by gRPC-level status code.
message RemoveFeedResponse {
}

message EditFeedRequest {
  // Required. Username for user for whom this feed should be edited.
  string Username = 1;

  // Required. Internal identifier for existing feed object.
  int64 Id = 2;

  // Required. Name of new folder this feed should be moved to.
  // Note: This folder must already exist.
  string Folder = 3;
}

// Empty response. Success is indicated by gRPC-level status code.
message EditFeedResponse {
}

// Rule mapping a feed ID to a mute regex pattern.
message FeedMuteRegexRule {
  // Required. The internal identifier of the feed.
  int64 FeedId = 1;

  // Required. The regex pattern to filter articles for this feed.
  string Regex = 2;
}

// Request to get all feed-specific mute regexes for a user.
message GetFeedMuteRegexesRequest {
  // Required. Username for user for whom feed mute regexes should be retrieved.
  string Username = 1;
}

// Response containing all feed-specific mute regex rules for a user.
message GetFeedMuteRegexesResponse {
  // List of feed mute regex rules for the user.
  repeated FeedMuteRegexRule Rules = 1;
}

// Request to add a feed-specific mute regex pattern.
message AddFeedMuteRegexRequest {
  // Required. Username for user for whom the feed mute regex should be added.
  string Username = 1;

  // Required. The internal identifier of the feed to apply the regex to.
  int64 FeedId = 2;

  // Required. The regex pattern to match against article title and contents.
  string Regex = 3;
}

// Empty response. Success is indicated by gRPC-level status code.
message AddFeedMuteRegexResponse {
}

// Request to delete a feed-specific mute regex pattern.
message DeleteFeedMuteRegexRequest {
  // Required. Username for user for whom the feed mute regex should be deleted.
  string Username = 1;

  // Required. The internal identifier of the feed.
  int64 FeedId = 2;

  // Required. The specific regex pattern to remove.
  string Regex = 3;
}

// Empty response. Success is indicated by gRPC-level status code.
message DeleteFeedMuteRegexResponse {
}

// The authentication surface that established a session.
//
// The set is closed: a scheme exists here only where the server issues the
// credential itself. Fever is absent by construction, since its key is derived
// by the client from the username and password.
enum AuthScheme {
  // Unset, or a scheme this server does not recognize.
  AUTH_SCHEME_UNSPECIFIED = 0;

  // Established through the GReader ClientLogin endpoint and presented as a
  // bearer token.
  AUTH_SCHEME_GREADER = 1;

  // Established through the web login form and presented as a cookie.
  AUTH_SCHEME_WEB = 2;
}

// A single authenticated login held by one client.
message Session {
  // Identifier for this session, as accepted by RevokeSessions.
  string SessionId = 1;

  // Which authentication surface established this session.
  AuthScheme Scheme = 2;

  // When the session was established, in seconds since the Unix epoch.
  int64 CreatedUnixSec = 3;

  // When the session was last used, in seconds since the Unix epoch. Expiry is
  // measured from this, so an actively used session does not age.
  int64 LastSeenUnixSec = 4;

  // What the client called itself when the session was established. This is
  // client-supplied and may be absent or untrue.
  string UserAgent = 5;
}

message ListSessionsRequest {
  // Required. Username whose sessions should be listed.
  string Username = 1;
}

message ListSessionsResponse {
  // Unexpired sessions, most recently used first.
  repeated Session Session = 1;
}

// Selects every session belonging to the user.
message AllSessions {
}

message RevokeSessionsRequest {
  // Required. Username whose sessions should be revoked.
  string Username = 1;

  // Required. Which sessions to revoke.
  oneof target {
    // A single session, identified as ListSessions returns it.
    string SessionId = 2;

    // Every session the user has.
    AllSessions All = 3;
  }
}

message RevokeSessionsResponse {
  // Number of sessions revoked. Zero means nothing matched, which for a single
  // session means it was already gone.
  int64 RevokedCount = 1;
}

message ChangePasswordRequest {
  // Required. Username whose password should be changed.
  string Username = 1;

  // Required. The new password, in the clear. The admin service listens on
  // loopback only, and the server needs the password itself to derive both the
  // stored hash and the Fever key.
  string Password = 2;
}

message ChangePasswordResponse {
  // Number of sessions revoked as part of the change. Every session is
  // revoked, since a password change is meant to end access from wherever the
  // old one reached.
  int64 RevokedSessionCount = 1;
}

message ResignProxiedImagesRequest {
  // Required. Username whose stored articles should be updated.
  string Username = 1;

  // If set, report what would change without writing anything.
  bool DryRun = 2;
}

message ResignProxiedImagesResponse {
  // Articles examined.
  int64 ArticlesScanned = 1;

  // Articles that carried at least one URL needing a signature.
  int64 ArticlesUpdated = 2;

  // Individual image URLs signed.
  int64 UrlsSigned = 3;
}

service AdminService {
  // Add a new user into the system.
  rpc AddUser (AddUserRequest) returns (AddUserResponse);

  // List the unexpired sessions belonging to a user.
  rpc ListSessions (ListSessionsRequest) returns (ListSessionsResponse);

  // Revoke one session, or every session, belonging to a user.
  rpc RevokeSessions (RevokeSessionsRequest) returns (RevokeSessionsResponse);


  // Re-sign image proxy URLs in stored article content.
  //
  // Content stored before proxy URLs carried signatures names targets the proxy
  // now refuses, which shows up as broken images in articles that used to
  // render. Signing depends only on the target and the configured key, so those
  // URLs can be brought up to date in place. Safe to run more than once.
  rpc ResignProxiedImages (ResignProxiedImagesRequest) returns (ResignProxiedImagesResponse);

  // Change a user's password.
  //
  // This resets every credential derived from the password: the Fever API key
  // changes, so Fever clients must be reconfigured, and tokens issued before
  // sessions existed stop working. Every session is revoked as well, so all
  // clients must sign in again.
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);

  // Get current muted words for a user.
  rpc GetMuteWords (GetMuteWordsRequest) returns (GetMuteWordsResponse);

  // Add mute words for a user.
  rpc AddMuteWord (AddMuteWordRequest) returns (AddMuteWordResponse);

  // Delete muted word for a user.
  rpc DeleteMuteWord (DeleteMuteWordRequest) returns (DeleteMuteWordResponse);

  // Get current unmuted feeds for a user.
  rpc GetUnmutedFeeds (GetUnmutedFeedsRequest) returns (GetUnmutedFeedsResponse);

  // Add unmute feed for a user.
  rpc AddUnmutedFeed (AddUnmutedFeedRequest) returns (AddUnmutedFeedResponse);

  // Delete unmute feed for a user.
  rpc DeleteUnmutedFeed (DeleteUnmutedFeedRequest) returns (DeleteUnmutedFeedResponse);

  // Get feed-specific mute regexes for a user.
  rpc GetFeedMuteRegexes (GetFeedMuteRegexesRequest) returns (GetFeedMuteRegexesResponse);

  // Add a feed-specific mute regex for a user.
  rpc AddFeedMuteRegex (AddFeedMuteRegexRequest) returns (AddFeedMuteRegexResponse);

  // Delete a feed-specific mute regex for a user.
  rpc DeleteFeedMuteRegex (DeleteFeedMuteRegexRequest) returns (DeleteFeedMuteRegexResponse);

  // Return all feeds for a user.
  rpc GetFeeds (GetFeedsRequest) returns (GetFeedsResponse);

  // Add a new feed.
  rpc AddFeed (AddFeedRequest) returns (AddFeedResponse);

  // Remove an existing feed.
  rpc RemoveFeed (RemoveFeedRequest) returns (RemoveFeedResponse);

  // Edit an existing feed.
  rpc EditFeed (EditFeedRequest) returns (EditFeedResponse);
}